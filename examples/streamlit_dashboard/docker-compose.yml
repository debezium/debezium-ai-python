version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: debezium-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: debezium
      MYSQL_PASSWORD: dbzpassword
    command:
      - --server-id=184054
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./setup_db.sql:/docker-entrypoint-initdb.d/setup_db.sql
