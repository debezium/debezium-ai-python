name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Repository (TestPyPI or PyPI)'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build-and-publish:
    name: Build and publish Python distribution
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # Required for PyPI/TestPyPI OIDC Trusted Publishing
      contents: read       # Required for actions/checkout

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Build and Twine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Source and Wheel Distributions
        run: python -m build

      - name: Check Package Metadata and Layout
        run: twine check dist/*

      - name: Publish Package to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish Package to PyPI
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
